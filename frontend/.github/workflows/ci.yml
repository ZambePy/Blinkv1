name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, type-check, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (produção, bloqueia em critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000/api
          VITE_WS_URL: ws://localhost:8000/ws/tracker
          VITE_CAREGIVER_PIN: '1234'

      # D8.1 (ROADMAP §5) — smoke test da CLI de baseline. Roda SEMPRE (independe
      # de fixture) para garantir que o measure_baseline.mjs e o
      # check_baseline_regression.mjs continuam parseando os args sem crash.
      # Sem isso, a CLI regride silenciosamente e o gate real (abaixo) nunca
      # é exercitado até haver fixture — janela de risco muito grande.
      - name: Baseline CLI smoke test
        working-directory: ${{ github.workspace }}
        run: |
          node frontend/scripts/measure_baseline.mjs --help
          node frontend/scripts/check_baseline_regression.mjs --help

      # D8.1 (ROADMAP §5) — gate de regressão de precisão. Roda APENAS quando
      # existe fixture committed (`fixtures/replay/ci-baseline.jsonl`) E
      # snapshot baseline (`fixtures/replay/ci-baseline.report.json`).
      # Enquanto essa dupla não estiver no repo (pendência humana — depende
      # de sessão física com webcam), este step vira no-op sem quebrar o CI.
      # Quando ambos existirem, o CI:
      #   1. Roda measure_baseline.mjs contra a fixture, gera current.report.json
      #   2. Compara current vs baseline via check_baseline_regression.mjs
      #   3. Falha se meanErrorPx da variante default excede baseline + 15%
      # Tolerância 15% é preliminar — recalibrar quando houver histórico.
      - name: Baseline regression gate (só se fixture existir)
        working-directory: ${{ github.workspace }}
        run: |
          FIXTURE=fixtures/replay/ci-baseline.jsonl
          BASELINE=fixtures/replay/ci-baseline.report.json
          if [ -f "$FIXTURE" ] && [ -f "$BASELINE" ]; then
            echo "[ci] fixture e baseline encontrados — rodando gate de regressão"
            node frontend/scripts/measure_baseline.mjs \
              --jsonl "$FIXTURE" \
              --out fixtures/replay/ci-current.report.json
            node frontend/scripts/check_baseline_regression.mjs \
              --baseline "$BASELINE" \
              --current fixtures/replay/ci-current.report.json \
              --tolerance-pct 15
          else
            echo "[ci] fixture ($FIXTURE) ou baseline ($BASELINE) não commitados — pulando gate."
            echo "[ci] pendência humana registrada em fixtures/replay/README.md e ROADMAP D8."
          fi
