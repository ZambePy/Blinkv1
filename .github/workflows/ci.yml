name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Uma execução por branch: um push novo cancela a anterior em vez de
# enfileirar builds que já nasceram obsoletos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # `electron/build.mjs` marca `electron` como external — o compile é só
      # esbuild sobre main.ts/preload.ts e nunca executa o binário. Sem esta
      # variável o `npm ci` baixaria ~359 MB no postinstall para nada, somando
      # tempo e mais um ponto de falha de rede.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1

    steps:
      - uses: actions/checkout@v4

      # `canvas` NÃO é dependência decorativa: `qualityAnalyzer.a1-5.test.ts`
      # renderiza canvas 2D de verdade dentro do jsdom para exercitar o
      # analisador de qualidade com pixels reais, e o jsdom delega `getContext`
      # a este módulo nativo.
      #
      # O install dele é `prebuild-install -r napi || node-gyp rebuild`. O
      # prebuild costuma existir para linux-x64, mas quando não existe o
      # fallback compila — e aí precisa destas bibliotecas. Instalar antes custa
      # ~15 s e elimina um modo de falha que só apareceria como `npm ci`
      # quebrado, sem indicar a causa.
      - name: Bibliotecas de sistema para o canvas nativo
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      # Node 24 (LTS) e NÃO 20.
      #
      # Duas razões, ambas vieram de falha real de CI:
      #
      #   1. `package-lock.json` foi gerado pelo npm 11, que aninha
      #      `@emnapi/core` e `@emnapi/runtime` sob
      #      `@rolldown/binding-wasm32-wasi/node_modules/`. O npm 10.8.2 que
      #      acompanha o Node 20 espera esses pacotes no topo e aborta com
      #      `EUSAGE — Missing: @emnapi/core from lock file`. Node 24 traz o
      #      npm 11 e lê o lockfile do mesmo jeito que a máquina que o gerou.
      #
      #   2. `node-abi` (via electron-builder) declara `engines.node >=22.12.0`.
      #      No Node 20 isso saía como EBADENGINE em todo install.
      #
      # Manter esta versão alinhada com `engines.node` do package.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # NENHUM passo abaixo usa `npm --prefix <dir> <cmd>`.
      #
      # Esse formato quebrou o primeiro CI: o npm do runner interpretou
      # `frontend` como argumento POSICIONAL de `ci` (virou `npm ci frontend`)
      # e imprimiu o usage em vez de instalar. A combinação `--prefix` + `ci` é
      # ambígua entre versões de npm; `working-directory` do próprio Actions
      # não passa pelo parser de argumentos do npm e não tem esse problema.
      - name: Instalar dependências (raiz)
        run: npm ci

      - name: Instalar dependências (frontend)
        working-directory: frontend
        run: npm ci

      # Os pesos do L2CS (92 MB) são gitignored, então o CI roda sem eles.
      # Isso é intencional e não reduz a cobertura: nenhum teste lê o arquivo
      # do modelo — a lógica testável do L2CS (recorte, decodificação, bloco
      # angular, plausibilidade de ângulo) é pura e independe dos pesos.
      - name: Verificação de tipos (núcleo)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Verificação de tipos (Electron)
        run: npx tsc --noEmit -p electron/tsconfig.json

      - name: Testes do núcleo do pipeline
        run: npm test

      - name: Testes da interface
        working-directory: frontend
        run: npm test

      # `tsc -b` é mais estrito que o `--noEmit` acima (pega imports não usados,
      # por exemplo), então o build também serve de verificação de tipos.
      - name: Build de produção
        working-directory: frontend
        run: npm run build

      - name: Compilar processo Electron
        run: npm run electron:compile

      # NOTA: `npm run lint` (oxlint) fica FORA deste workflow de propósito.
      # Ele sai com código 1 por warnings pré-existentes em
      # `frontend/scripts/*.mjs` (console e imports não usados em ferramentas de
      # desenvolvimento). Adicionar um portão que já nasce vermelho tornaria o
      # badge inútil — o certo é limpar os warnings e então incluir a etapa.
